name: Security Gate

# PLAN-018 Phase 3: the checks that must fail a build rather than be remembered.
#   · route guards  — every authenticated API route carries a permission (P0-2)
#   · typechecks    — API and web compile
#   · dependencies  — no new production or high-severity advisory (Phase 1/3)
#   · secrets       — gitleaks over the working tree and history
#   · config/CVE    — trivy misconfiguration and dependency scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: Route guards and typechecks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: '9.1.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every authenticated route carries a permission
        run: pnpm guard:routes

      # The generated Prisma client is not in the repository — it is produced from the schema, and
      # nothing in this job used to produce it. Without it every model type is `any`, which the next
      # step then reports as 200+ errors that are about the missing client rather than about the code
      # (TS2347 "untyped function calls may not accept type arguments" is the signature). The
      # container does the same thing against the copied schema, for the same reason.
      - name: Generate the Prisma client
        run: pnpm --filter @C7NTAX/api db:generate

      - name: Typecheck the API
        run: pnpm --filter @C7NTAX/api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck the web app
        run: pnpm --filter @C7NTAX/web exec tsc --noEmit -p tsconfig.json

  dependencies:
    name: Dependency baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: '9.1.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a new production advisory of any severity, or a new high/critical one
      # anywhere. Accepted risks carry their reasons in security/audit-baseline.json.
      - name: No unaccepted advisories
        run: pnpm guard:deps

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI rather than gitleaks-action: the action requires a licence key for an
      # organisation repository, and the scanner itself is MIT — so this is the same scan with
      # nothing to buy and nothing to remember. Pinned by version and checked against the
      # published checksums, because a step whose job is to fail a build should not be able to
      # change underneath us. (The checksums file names the asset, so the download keeps its
      # release filename and the verification happens in the directory it landed in.)
      - name: gitleaks
        run: |
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL "${BASE}/${ASSET}" -o "${ASSET}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}"
          ./gitleaks detect --source "$GITHUB_WORKSPACE" --redact --verbose --exit-code 1

  misconfiguration:
    name: Config and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v0.28.0 never ran, for two reasons it took CI to tell us: the tag needed its `v`, and even
      # with it that release pins `aquasecurity/setup-trivy@v0.2.1` — a tag that no longer exists
      # (the remaining ones are v0.2.6, v0.3.0, v0.3.1) — so the action could never install its own
      # scanner. Bumped deliberately rather than re-pinned, because the old release is unreachable
      # rather than merely old. A bump can surface new findings; that is the point of a scanner.
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: config,secret,vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
