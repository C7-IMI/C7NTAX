name: Deploy to Azure

# PLAN-016 deploy pipeline.
#
#   · every push to main builds the image and deploys **dev**, so the environment under
#     test always matches the branch
#   · **prod is never automatic**: it runs only from a manual dispatch, which is the
#     "Push to Prod" / "Go Live" action the plan describes
#   · both environments go through the same ordered pipeline (image → schema → revision →
#     health gate → traffic), so a failed health check leaves the running revision serving
#
# The path is sync → dev → prod, and the pipeline enforces the middle step:
#
#   · a push to main **builds** the image (the tag is the commit sha) and deploys it to dev
#   · a manual dispatch for prod, with no image_tag, **promotes what dev is running** — the
#     tag is read back from dev's Container App and the image is copied from dev's registry
#     into prod's, so production only ever receives an artifact dev has already served, and
#     nothing is built twice
#   · a dispatch with an explicit image_tag deploys that tag without building, which is how
#     a rollback is done
#
# Each environment has its own registry, so the registry is resolved per environment.
#
# Authentication is OIDC federated credentials — there is no publish profile or client
# secret stored in the repository. See infra/README.md for the one-time setup.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'PlanDocs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (prod requires the production GitHub environment approval)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      image_tag:
        description: 'Deploy this tag instead of building or promoting (leave empty to build on dev, or to promote the tag dev is running)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP_DEV: rg-c7ntax-dev

jobs:
  build:
    name: Prepare the image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.registry.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login comes first because promotion has to read the running dev app, and the registry
      # is the *target* environment's: each environment has its own, and a Container App can
      # only pull a registry its own identity holds AcrPull on.
      - id: registry
        name: Resolve the target environment's registry
        run: |
          environment="${{ github.event.inputs.environment || 'dev' }}"
          server=$(az acr list --resource-group "rg-c7ntax-${environment}" --query "[0].loginServer" -o tsv)
          if [ -z "$server" ]; then
            echo "::error::no container registry in rg-c7ntax-${environment}: that environment has to be created before it can be deployed to"
            exit 1
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "name=${server%%.*}" >> "$GITHUB_OUTPUT"
          echo "registry: $server"

      - id: tag
        name: Decide what runs — build, promote, or a named tag
        run: |
          set -euo pipefail
          environment="${{ github.event.inputs.environment || 'dev' }}"
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            # An explicit tag is a deliberate act — re-deploying something already verified, or
            # rolling back. It is never rebuilt.
            tag="${{ github.event.inputs.image_tag }}"
            action=deploy
          elif [ "$environment" = "prod" ]; then
            # Push to production: deploy the tag dev is already serving, so no commit that dev
            # has not run can reach prod.
            image=$(az containerapp show --name c7ntax-dev --resource-group "${{ env.RESOURCE_GROUP_DEV }}" \
              --query "properties.template.containers[0].image" -o tsv)
            if [ -z "$image" ]; then
              echo "::error::dev is not running an image, so there is nothing to promote — deploy dev first"
              exit 1
            fi
            tag="${image##*:}"
            action=promote
          else
            tag="$(git rev-parse --short HEAD)"
            action=build
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "### ${action}: c7ntax:${tag}" >> "$GITHUB_STEP_SUMMARY"

      # The image is built once and promoted unchanged: the artifact dev verified is the
      # artifact prod runs, which is the whole point of the dev/prod split.
      - name: Build and push
        if: steps.tag.outputs.action == 'build'
        run: |
          az acr build --registry "${{ steps.registry.outputs.name }}" --image "c7ntax:${{ steps.tag.outputs.tag }}" .

      - name: Copy the artifact from dev (promotion)
        if: steps.tag.outputs.action == 'promote'
        run: |
          source=$(az acr list --resource-group "${{ env.RESOURCE_GROUP_DEV }}" --query "[0].loginServer" -o tsv)
          target="${{ steps.registry.outputs.server }}"
          if [ "$source" = "$target" ]; then
            echo "dev and prod share the registry $source; nothing to copy"
          else
            # Import carries the manifest and its layers by digest, so prod still runs exactly
            # what dev verified — and prod does not depend on dev's registry to keep serving.
            az acr import --name "${{ steps.registry.outputs.name }}" \
              --source "${source}/c7ntax:${{ steps.tag.outputs.tag }}" \
              --image "c7ntax:${{ steps.tag.outputs.tag }}" --only-show-errors
            echo "copied c7ntax:${{ steps.tag.outputs.tag }} from $source to $target"
          fi

      - name: Verify the image is in the target registry
        run: |
          found=$(az acr repository show-tags --name "${{ steps.registry.outputs.name }}" \
            --repository c7ntax --query "[?@=='${{ steps.tag.outputs.tag }}'] | [0]" -o tsv)
          if [ "$found" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "::error::c7ntax:${{ steps.tag.outputs.tag }} is not in ${{ steps.registry.outputs.server }}"
            exit 1
          fi

  migrate:
    name: Apply schema (${{ github.event.inputs.environment || 'dev' }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The same image, with the command overridden, so the schema is applied by exactly
      # the code that expects it. Waits for the job and fails the pipeline on anything
      # other than Succeeded, before any traffic moves.
      #
      # The job runs as the app's *user-assigned* identity, which is the only one holding AcrPull on
      # the registry and Key Vault Secrets User on the vault. A system-assigned identity of its own
      # holds neither, so it could neither pull the image nor read DATABASE_URL — every push to main
      # failed here (PLAN-030 §1.8, review §3). This mirrors scripts/azure/deploy-env.ps1; keep the
      # two in step.
      - name: Run prisma migrate deploy
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          JOB="c7ntax-${ENVIRONMENT}-migrate"
          IMAGE="${{ needs.build.outputs.registry }}/c7ntax:${{ needs.build.outputs.tag }}"

          ID=$(az containerapp show --name "$APP" --resource-group "$RG" \
            --query "identity.userAssignedIdentities | keys(@)" -o tsv | head -n1)
          if [ -z "$ID" ]; then
            echo "::error::$APP has no user-assigned identity, so the migration job cannot pull its image or read DATABASE_URL — deploy the infrastructure to this environment first"
            exit 1
          fi
          VAULT=$(az keyvault list --resource-group "$RG" --query "[0].name" -o tsv)
          if [ -z "$VAULT" ]; then
            echo "::error::no Key Vault in $RG to read DATABASE-URL from; the migration job needs it"
            exit 1
          fi
          VAULT_URI=$(az keyvault show --name "$VAULT" --query "properties.vaultUri" -o tsv)

          # Create the first time, move the image afterwards: `job create` on a job that already
          # exists fails, which is what a second push to main would hit.
          #
          # The update passes **only** `--image`. Identity and the registry pull identity are not
          # update arguments at all — `az containerapp job update` takes neither `--mi-user-assigned`
          # nor `--registry-identity` (checked against the Azure CLI reference) — and they do not need
          # re-stating: both were set at creation and persist. Passing them made every push after the
          # first fail here with `unrecognized arguments`, before the deploy stage, which is the same
          # outcome §3 fixed, moved from the first push to the second.
          if az containerapp job show --name "$JOB" --resource-group "$RG" --query "name" -o tsv >/dev/null 2>&1; then
            az containerapp job update \
              --name "$JOB" --resource-group "$RG" \
              --image "$IMAGE" \
              --only-show-errors
          else
            # `--command` is a list of space-separated values, not one string (az containerapp job
            # create --help: "A list of supported commands on the container that will executed during
            # startup. Space-separated values e.g. '/bin/queue' 'mycommand'"). Quoted as one argument
            # it becomes a single argv entry and the container tries to exec a program named
            # "npx prisma migrate deploy", so the job fails with the previous revision still serving.
            #
            # This comment belongs ABOVE the command, and that is not tidiness. Written between the
            # continued arguments below, the `#` ends the backslash chain: bash joins the next line,
            # the comment swallows it, and `az` is invoked with everything up to `--image` and none
            # of the flags after it — no command, no registry, no identity, no secrets — while those
            # flag lines run as a command of their own. It fails once, in the environment being
            # created, and a re-run takes the update branch above and never sees it.
            # `scripts/azure/check-workflow-shell.mjs` fails on exactly that shape.
            az containerapp job create \
              --name "$JOB" --resource-group "$RG" --environment "aca-c7ntax-${ENVIRONMENT}" \
              --image "$IMAGE" \
              --command npx prisma migrate deploy \
              --cpu 0.5 --memory 1.0Gi --replica-timeout 900 --replica-retry-limit 1 \
              --registry-server "${{ needs.build.outputs.registry }}" \
              --mi-user-assigned "$ID" --registry-identity "$ID" \
              --secrets "database-url=keyvaultref:${VAULT_URI}secrets/DATABASE-URL,identityref:$ID" \
              --env-vars "DATABASE_URL=secretref:database-url" \
              --only-show-errors
          fi

          # Poll the execution `start` created, by name. `job execution list --query "[0]"` is not
          # documented as newest-first, and on a second deploy the newest row is still the *previous*
          # run — which succeeded — so the gate would report success before the migration had begun.
          EXECUTION=$(az containerapp job start --name "$JOB" --resource-group "$RG" --query "name" -o tsv --only-show-errors)
          if [ -z "$EXECUTION" ]; then
            echo "::error::the migration job did not return an execution name, so there is nothing to wait on"
            exit 1
          fi
          for i in $(seq 1 60); do
            state=$(az containerapp job execution show --name "$JOB" --resource-group "$RG" \
              --job-execution-name "$EXECUTION" --query "properties.status" -o tsv --only-show-errors)
            if [ "$state" = "Succeeded" ]; then echo "migration applied"; exit 0; fi
            case "$state" in
              Failed|Degraded|Stopped)
                echo "::error::migration job $EXECUTION ended as $state — the previous revision keeps serving"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migration job $EXECUTION did not finish in 10 minutes (last status: $state)"
          exit 1

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'dev' }})
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture the current revision (for rollback)
        id: previous
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          echo "revision=$(az containerapp revision list --name "$APP" --resource-group "$RG" --query "[?properties.trafficWeight>=\`100\`].name | [0]" -o tsv)" >> "$GITHUB_OUTPUT"

      # A new revision is created and left at 0% traffic, then checked. Only a healthy
      # revision is promoted, so a bad build never takes the environment down.
      - name: Create the revision
        id: revision
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          SUFFIX="${ENVIRONMENT}-${{ needs.build.outputs.tag }}"
          TAG="${{ needs.build.outputs.tag }}"
          IMAGE="${{ needs.build.outputs.registry }}/c7ntax:$TAG"
          az containerapp revision set-mode --name "$APP" --resource-group "$RG" --mode multiple --only-show-errors
          # The revision is read back from *this call's own answer*, not from a filter over the
          # revision list. `properties.latestRevisionName` is the revision this update created.
          #
          # What it replaced: `revision list --query "[?properties.template.revisionSuffix=='$SUFFIX']"`.
          # The suffix is `<environment>-<tag>`, so re-running the same commit — a retried workflow, or
          # a rollback dispatched with the previous tag — asks for a suffix that already names a
          # revision. If Azure reuses or reports that older revision, the filter matches *it*, the
          # health gate reads the revision that is already serving, passes, and traffic is shifted to
          # the image that was already there: a green pipeline that deployed nothing. Reading the name
          # out of the update removes the filter that could match the wrong revision, and the two
          # assertions below make the remaining cases loud rather than green.
          #
          # The health is read from that one revision. `properties.revisionSuffix` is not a property of
          # a revision (the CLI's Revision serializer carries the suffix only on properties.template),
          # so the filter that used to be here matched nothing and this step could never see the new
          # revision become healthy. See scripts/azure/deploy-env.ps1 for the full note.
          REVISION=$(az containerapp update --name "$APP" --resource-group "$RG" \
            --image "$IMAGE" \
            --revision-suffix "$SUFFIX" --only-show-errors \
            --query "properties.latestRevisionName" -o tsv)
          if [ -z "$REVISION" ]; then
            echo "::error::az containerapp update returned no revision name, so there is nothing to wait on"
            exit 1
          fi
          case "$REVISION" in
            *--"$SUFFIX") ;;
            *)
              echo "::error::the update produced revision '$REVISION', which is not '$APP--$SUFFIX' — a revision with that suffix already exists, so this run may not have created the one it asked for, and the health gate below would have read the older, already-serving revision and passed"
              exit 1 ;;
          esac
          RUNNING_IMAGE=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
            --revision "$REVISION" --query "properties.template.containers[0].image" -o tsv)
          case "$RUNNING_IMAGE" in
            *:"$TAG") ;;
            *)
              echo "::error::revision $REVISION is running '$RUNNING_IMAGE', which is not the image this run built (tag $TAG)"
              exit 1 ;;
          esac
          state=""
          for i in $(seq 1 60); do
            state=$(az containerapp revision show --name "$APP" --resource-group "$RG" \
              --revision "$REVISION" --query "properties.healthState" -o tsv)
            if [ "$state" = "Healthy" ]; then break; fi
            if [ "$state" = "Unhealthy" ]; then echo "new revision $REVISION is unhealthy"; exit 1; fi
            sleep 10
          done
          if [ "$state" != "Healthy" ]; then
            echo "new revision did not become healthy in 10 minutes (state: '$state', revision: '$REVISION')"
            exit 1
          fi
          echo "revision $REVISION is healthy"
          echo "name=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Health gate on the new revision
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          FQDN=$(az containerapp revision show --name "$APP" --resource-group "$RG" --revision "${{ steps.revision.outputs.name }}" --query "properties.fqdn" -o tsv)
          # /api/ready, not /api/health: this gate decides whether a revision takes 100% of traffic, and
          # "Node is listening" is not the same as "this revision can serve" — a wrong DATABASE_URL or a
          # failed migration passes the shallow check. deep=1 is safe here: migrations have already run
          # in this workflow, unlike the readiness probe, which is left shallow for the first run.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/ready?deep=1" || true)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "readiness gate failed for the new revision"; exit 1

      - name: Shift traffic
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          # `ingress traffic set` takes `--revision-weight <revision-name>=<weight>`. It has no
          # `--revision`/`--weight`; the old form failed with `unrecognized arguments: --weight 100`.
          az containerapp ingress traffic set --name "$APP" --resource-group "$RG" \
            --revision-weight "${{ steps.revision.outputs.name }}=100" --only-show-errors

      - name: Verify the public endpoint
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" --query "properties.configuration.ingress.fqdn" -o tsv)
          for path in /api/ready /api/health /; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Roll back on failure
        if: failure()
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          RG="rg-c7ntax-${ENVIRONMENT}"
          APP="c7ntax-${ENVIRONMENT}"
          if [ -n "${{ steps.previous.outputs.revision }}" ]; then
            az containerapp ingress traffic set --name "$APP" --resource-group "$RG" \
              --revision-weight "${{ steps.previous.outputs.revision }}=100" --only-show-errors
            echo "traffic returned to ${{ steps.previous.outputs.revision }}"
          fi
