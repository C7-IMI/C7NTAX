<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="C7NTAX — Professional Services Automation" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>C7NTAX</title>
    <style>
      /* Inline critical CSS so something renders before JS loads */
      body { margin: 0; background: #0a1628; color: #e2e8f0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root:empty::after {
        content: "Loading C7NTAX…";
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; font-size: 16px; color: #64748b;
      }
      noscript div {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 2rem; text-align: center; color: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-navy-950 text-white antialiased">
    <div id="root"></div>
    <noscript>
      <div>
        <div>
          <h1 style="color:#fff;font-size:20px;margin-bottom:8px">JavaScript Required</h1>
          <p style="font-size:14px;margin-bottom:16px">C7NTAX requires JavaScript to run.</p>
          <p style="font-size:12px;color:#64748b">
            Run <code style="background:#1e293b;padding:2px 6px;border-radius:4px">pnpm install && pnpm dev</code>
            from the project root, then open <code style="background:#1e293b;padding:2px 6px;border-radius:4px">http://localhost:5173</code>
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && window.location.protocol !== "file:") {
        navigator.serviceWorker.register("/sw.js").catch(function(){});
      }
    </script>
  </body>
</html>
