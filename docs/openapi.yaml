  "/api/oauth-app/import":
    post:
      tags: ["Oauth App"]
      operationId: "postOauthAppimport"
      summary: "Read the script's output (or the four values) instead of deploying from here"
      description: "The offline path through the wizard, for a tenant this instance cannot reach the Microsoft sign-in endpoint, or a registration that already exists. Paste the contents of `O365/out/c7ntax-m365-app.json` in `scriptJson`, or send `tenantId`/`clientId`/`clientSecret`/`mailbox` directly. Refuses a client id that is not a GUID, and refuses a registration granted `Mail.Read` instead of `Mail.ReadWrite` — the connector marks messages read, so read-only connects and then fails on the first message."
      requestBody:
        content:
          application/json:
            example: {"scriptJson":"{ \"tenantId\": \"contoso.onmicrosoft.com\", \"clientId\": \"1a2b3c4d-…\", \"secret\": \"…\", \"mode\": \"AppOnly\" }"}
